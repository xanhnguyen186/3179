<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css" integrity="sha384-X38yfunGUhNzHpBaEBsWLO+A0HDYOQi8ufWDkZ0k9e0eXz/tH3II7uKZ9msv++Ls" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/grids-responsive-min.css" />
<head>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism UI</title>
  <style>
    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
    }

    /* Background image */
    .background {
      background-image: url('https://snu.edu.in/site/assets/files/20616/key_components_of_artificial_intelligence_f_mainimg_gg.1600x0.webp'); /* Replace with your image */
      background-size: cover;
      background-position: center;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Glass frame */
    .glass-card {
      width: 90%;
      max-width: 600px;
      padding: 2rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .glass-card h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .glass-card p {
      font-size: 1rem;
      line-height: 1.5;
    }

    .glass-card a {
      color: #00ffff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="background">
    <div class="glass-card">
      <h1>@uix.vikram</h1>
      <p>🖊️ Freelance web & App designer<br>
      Create with <strong>@framer</strong> & <strong>@figma</strong><br>
      Contact: <a href="mailto:vikramtech69@gmail.com">vikramtech69@gmail.com</a></p>
      <p><em>Kozhikode, India — 01/28/2025</em></p>
    </div>
  </div>
</body>
</html>
